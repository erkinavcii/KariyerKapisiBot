name: Kariyer Kapisi Günlük Bot

on:
  schedule:
    # Her gün UTC saatiyle 06:00'da çalış (Türkiye saatiyle ~09:00)
    - cron: '0 6 * * *'
  workflow_dispatch: # Elle tetiklemek için buton ekler (Test etmek için)

permissions:
  contents: write # seen_jobs.json dosyasını güncellemek için YAZMA izni şart

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ADAY_PROFILI: ${{ secrets.ADAY_PROFILI }}
          DOGUM_YILI: ${{ secrets.DOGUM_YILI }}
        # Birden fazla mod istersen satır ekle, ör. ikinci satır: python kariyerkapisibot.py --mod duz
        # (her mod kendi seen_jobs_<mod>.json dosyasını tutar; ayrı sohbet için TELEGRAM_CHAT_ID_DUZ vb.)
        run: |
          python kariyerkapisibot.py

      - name: Durumu Güncelle (Git Scraping)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add seen_jobs_*.json
          git commit -m "Durum güncellendi: $(date -u)" || exit 0
          git push
